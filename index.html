<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2027">
<meta name="robots" content="noindex">
<title>Kolvind Watchtower</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231b2027'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d9531e' stroke-width='3'/%3E%3Ccircle cx='16' cy='9' r='2.4' fill='%23ffb27a'/%3E%3C/svg%3E">
<!--
  Kolvind Watchtower Web: the ideas board (plan/board.json on main in Troos88/warmth-vst) in a browser.
  This page holds NO data. It reads and writes the board through the GitHub API with a token that stays in this
  browser only. Saving merges card by card exactly like tools/release_test/board.py (merge / merge_card / dumps),
  so the desktop Watchtower, Claude and this page never overwrite each other. Keep the two in step.
-->
<style>
:root{
  --bg:#eef0f2; --panel:#ffffff; --panel2:#f6f7f8; --ink:#1b2027; --muted:#5d6672; --line:#d5d9de;
  --ember:#d9531e; --ember-ink:#ffffff; --amber-bg:#fbe6dc; --pass:#1f8a4c; --fail:#c62a2a; --fail-bg:#fbeaea;
  --shadow:0 1px 2px rgba(20,24,30,.08),0 2px 8px rgba(20,24,30,.05);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --panel:#1b1f24; --panel2:#22272d; --ink:#e8eaed; --muted:#9aa3ad; --line:#2f353c;
    --ember:#e8662f; --amber-bg:#3a2419; --fail-bg:#3a1c1c; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1f24; --panel2:#22272d; --ink:#e8eaed; --muted:#9aa3ad; --line:#2f353c;
  --ember:#e8662f; --amber-bg:#3a2419; --fail-bg:#3a1c1c; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- top bar */
header{position:sticky;top:0;z-index:20;background:#1b2027;color:#e8eaed;padding:10px 16px calc(10px);padding-top:max(10px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font:600 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brand .knob{width:18px;height:18px;border-radius:50%;border:2.5px solid #d9531e;position:relative;box-shadow:0 0 10px rgba(217,83,30,.55)}
.brand .knob::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#ffb27a;left:5px;top:1px}
.brand small{color:#9aa3ad;letter-spacing:.1em}
.spacer{flex:1}
.status{font:12px/1 var(--mono);color:#9aa3ad;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{width:8px;height:8px;border-radius:50%;background:#5d6672;flex:none}
.led.ok{background:#2fbf6b;box-shadow:0 0 6px #2fbf6b}
.led.busy{background:#e8a33a;animation:pulse 1s infinite}
.led.bad{background:#e04a4a}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{background:none;border:1px solid #3a414a;color:#e8eaed;border-radius:8px;height:32px;min-width:32px;padding:0 8px;font-size:15px}
.iconbtn:active{background:#2a3038}

/* ---------- tools row */
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 6px;align-items:center}
.search{flex:1 1 180px;min-width:0;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.sel{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 8px;max-width:160px}
.chip{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--ember);color:var(--ink)}
.add{height:38px;border:0;border-radius:10px;padding:0 14px;background:var(--ember);color:var(--ember-ink);font-weight:600;white-space:nowrap}

/* ---------- column tabs (phone) */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.tab b{font:600 12px var(--mono);color:var(--muted);margin-left:5px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] b{color:inherit;opacity:.7}

/* ---------- board */
.board{display:block;padding:0 16px 120px}
.col{display:none}
.col.show{display:block}
.colhead{display:none}
.list{display:flex;flex-direction:column;gap:8px;min-height:60px}
@media (min-width:900px){
  .tabs{display:none}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding:6px 16px 40px;align-items:start}
  .col,.col.show{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
  .colhead{display:flex;align-items:baseline;gap:8px;padding:2px 4px 10px;font:600 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .colhead b{color:var(--ink)}
}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:10px 10px 10px 14px;display:flex;gap:8px;align-items:flex-start;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--area,#5d6672)}
.card .body{flex:1;min-width:0;cursor:pointer}
.card .t{font-weight:600;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:5px;font:12px/1.3 var(--mono);color:var(--muted)}
.card .why{margin-top:4px;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--area)}
.badge{border-radius:5px;padding:1px 6px;font-weight:600}
.badge.bug{background:var(--fail-bg);color:var(--fail)}
.badge.wait{background:var(--amber-bg);color:var(--ember)}
.badge.inbox{background:var(--panel2);border:1px dashed var(--muted)}
.grip{flex:none;width:30px;height:36px;margin:-4px -4px -4px 0;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border-radius:8px;user-select:none}
.grip:active{background:var(--panel2)}
.card.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(1.5deg);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:.95}
.drop-line{height:3px;border-radius:2px;background:var(--ember);margin:-2px 0}
.empty{color:var(--muted);font-size:14px;padding:18px 6px;text-align:center}

/* ---------- sheet (edit / add / setup) */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:86vh}}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .sub{color:var(--muted);font:12px var(--mono);margin-bottom:12px;overflow-wrap:anywhere}
.f{display:block;margin:12px 0 0}
.f>span{display:block;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.f input[type=text],.f input[type=password],.f textarea,.f select{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 10px}
.f textarea{resize:vertical;min-height:70px;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.f{flex:1 1 120px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.check input{width:20px;height:20px;accent-color:var(--ember)}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--panel);padding:10px 0 4px}
.btn{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 16px;font-weight:600}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink)}
.btn.danger{color:var(--fail)}
.btn.danger.armed{background:var(--fail);border-color:var(--fail);color:#fff}
.note{color:var(--muted);font-size:13.5px}
.note code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 4px;border-radius:4px}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;height:54px;padding:0 20px;border-radius:999px;border:0;background:var(--ember);color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(217,83,30,.45)}
@media (min-width:900px){.fab{display:none}}
@media (max-width:899px){.tools .add{display:none}}
/* ---------- morning test tour (read-only) */
.tg{margin:16px 0 4px;font:600 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.tg small{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
.tprep{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.tstep{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 11px;margin:6px 0}
.tstep .t{font-weight:600}
.tstep .d{font-size:13.5px;margin-top:3px}
.tstep.done{opacity:.55}
.tstep.done .t::before{content:"✓ ";color:var(--pass)}
/* ---------- the Almighty Ear (plan/ear/status.json): one line when the ear wants Tobias's ears */
.earban{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:11px 13px;border:1px solid var(--ember);border-radius:10px;
  background:var(--amber-bg);color:var(--ink);text-decoration:none;font-size:14.5px}
.earban b{color:var(--ember)}
.earban span:last-child{margin-left:auto;color:var(--ember);font-weight:600}
/* ---------- the robot from the phone (branch "robot": request.json from here, status.json + log.txt from the PC) */
.rb-state{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:14px;margin:6px 0 4px}
.rb-state .big{font-size:17px;font-weight:700}
.rb-state .d{margin-top:4px;font-size:14.5px}
.rb-state.ok{border-color:var(--pass)} .rb-state.bad{border-color:var(--fail);background:var(--fail-bg)} .rb-state.busy{border-color:var(--ember);background:var(--amber-bg)}
.rb-tot{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-top:8px;font-weight:700;font-size:15px}
.rb-tot span{white-space:nowrap}
.rb-tot .p{color:var(--pass)} .rb-tot .f{color:var(--fail)} .rb-tot .s{color:var(--muted)}
.rb-fail{border:1px solid var(--line);border-left:4px solid var(--fail);border-radius:9px;background:var(--panel);padding:8px 10px;margin:6px 0}
.rb-fail .t{font-weight:600;overflow-wrap:anywhere} .rb-fail .n{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.rb-pc{color:var(--muted);font-size:13px;margin-top:10px}
.rb-copy{width:100%;min-height:160px;font:12px/1.35 var(--mono);border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:8px}
.btn.wide{flex:1 1 100%}
.rb-steps{list-style:none;margin:10px 0 0;padding:0}
.rb-steps li{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:15px}
.rb-steps .dot{width:20px;text-align:center;flex:none}
.rb-steps li.todo{color:var(--muted)}
.rb-steps li.now{font-weight:700}
.rb-steps li.now .dot{animation:pulse 1.2s infinite}
.btn:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="knob" aria-hidden="true"></span><span>Watchtower <small>web</small></span></div>
  <div class="spacer"></div>
  <div class="status" id="status" title=""><span class="led" id="led"></span><span id="statusText">Starting…</span></div>
  <button class="iconbtn" id="robotBtn" title="Kör roboten från mobilen" aria-label="Roboten">🤖</button>
  <button class="iconbtn" id="tourBtn" title="Morning test tour (read-only list)" aria-label="Morning test tour">🔥</button>
  <button class="iconbtn" id="syncBtn" title="Get the latest board from GitHub" aria-label="Sync">⟳</button>
  <button class="iconbtn" id="setupBtn" title="Settings" aria-label="Settings">⚙</button>
</header>

<main id="app" class="hidden">
  <a class="earban hidden" id="earBan" target="_blank" rel="noopener"><span aria-hidden="true">👂</span><span id="earText"></span><span>Lyssna →</span></a>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Search cards" autocomplete="off">
    <select class="sel" id="area" aria-label="Part"></select>
    <button class="chip" id="waitOnly" aria-pressed="false">⏳ Waiting for me</button>
    <button class="add" id="addBtn">+ Idea</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <section class="board" id="board"></section>
</main>
<button class="fab hidden" id="fab">+ Idea</button>
<div id="sheetRoot"></div>

<script>
"use strict";
/* ================================================================ board logic (port of tools/release_test/board.py) */
const COLUMNS = [["idea","Ideas"],["next","Next"],["building","Building"],["testing","Testing"],["done","Done"],["parked","Maybe / parked"]];
const AREAS = ["Track","Master","Voice","Studio","Song X-ray","Guitar Lift","Tools","Release","Business"];
const SIZES = ["evening","weekend","big"];
const KEYS = ["id","title","why","area","size","column","order","kind","waiting","branch","checks","notes","source","updated"];
const AREA_COLOURS = {"Track":"#d9531e","Master":"#b8860b","Voice":"#8e44ad","Studio":"#2e86c1","Song X-ray":"#16a085",
  "Guitar Lift":"#a04000","Tools":"#5d6672","Release":"#1f8a4c","Business":"#34495e","Session flow":"#c0392b"};
const ABOUT = "Kolvind ideas board - edited in Kolvind Watchtower (tools/release_test) and by Claude.";
const BOARD_PATH = "plan/board.json";

const pad = n => String(n).padStart(2,"0");
function now(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function slug(t){ return (t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40).replace(/^-+|-+$/g,"")) || "card"; }
const clone = x => JSON.parse(JSON.stringify(x));
function canon(v){ // order-independent deep compare, like Python == (a missing field = null, like Python's .get())
  if (v === undefined) v = null;
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k)+":"+canon(v[k])).join(",") + "}";
  return JSON.stringify(v);
}
const eq = (a,b) => canon(a) === canon(b);
const colIndex = Object.fromEntries(COLUMNS.map(([c],i)=>[c,i]));
function cmp(a,b){ return a<b?-1:a>b?1:0; }

function dumps(data){
  const cards = [...(data.cards||[])].sort((a,b) =>
    ((colIndex[a.column] ?? 99) - (colIndex[b.column] ?? 99)) || ((a.order||0) - (b.order||0)) || cmp(a.id||"", b.id||""));
  const out = {about: data.about || ABOUT, cards: cards.map(c => { const o={}; for (const k of KEYS) if (k in c) o[k]=c[k]; return o; })};
  return JSON.stringify(out, null, 1) + "\n";
}
function renumber(data, column){
  const cards = data.cards.filter(c=>c.column===column).sort((a,b)=>(a.order||0)-(b.order||0));
  cards.forEach((c,i)=>c.order=(i+1)*10);
}
function move(data, id, column, index){
  const card = data.cards.find(c=>c.id===id); if (!card) return;
  const others = data.cards.filter(c=>c.column===column && c.id!==id).sort((a,b)=>(a.order||0)-(b.order||0));
  index = index==null ? others.length : Math.max(0, Math.min(index, others.length));
  others.splice(index, 0, card);
  card.column = column;
  others.forEach((c,i)=>c.order=(i+1)*10);
  card.updated = now();
}
function add(data, title, column="idea", fields={}){
  const ids = new Set(data.cards.map(c=>c.id));
  const base = slug(title); let id = base, n = 2;
  while (ids.has(id)) id = `${base}-${n++}`;
  const orders = data.cards.filter(c=>c.column===column).map(c=>c.order||0);
  const top = orders.length ? Math.min(...orders) : 10;
  const card = {id, title, column, order: top-5, kind:"idea", updated: now()};
  for (const [k,v] of Object.entries(fields)) if (v!==undefined && v!==null && v!=="") card[k]=v;
  data.cards.push(card); renumber(data, column); return card;
}
function mergeCard(cb, co, ct){
  const newer = (co.updated||"") >= (ct.updated||"") ? co : ct;
  if (!cb) return newer;
  const out = {};
  const keys = [...new Set([...Object.keys(cb), ...Object.keys(co), ...Object.keys(ct)])];
  for (const k of keys){
    const vb=cb[k], vo=co[k], vt=ct[k];
    const v = eq(vo,vb) ? vt : eq(vt,vb) ? vo : newer[k];
    if (v!==undefined && v!==null) out[k]=v;
  }
  out.updated = [(co.updated||""),(ct.updated||"")].sort().pop();
  return out;
}
function merge(base, ours, theirs){
  const m = d => new Map((d.cards||[]).map(c=>[c.id,c]));
  const b=m(base), o=m(ours), t=m(theirs), out=[];
  for (const id of new Set([...o.keys(), ...t.keys()])){
    const co=o.get(id), ct=t.get(id), cb=b.get(id);
    if (co && ct){
      if (eq(co,ct) || eq(ct,cb)) out.push(co);
      else if (eq(co,cb)) out.push(ct);
      else out.push(mergeCard(cb,co,ct));
    } else if (co){ if (!cb || !eq(co,cb)) out.push(co); }
    else if (ct){ if (!cb || !eq(ct,cb)) out.push(ct); }
  }
  return {about: ours.about || theirs.about, cards: out};
}
/* The morning test tour (plan/test-tour.json, made by tools/release_test/test_tour.py --plan) next to the live board:
   the same groups as groups_of() there (round + setup), a step is done when every card it belongs to is in Done. */
function tourRows(plan, data){
  const byId = new Map((data.cards||[]).map(c=>[c.id,c]));
  const cardDone = id => { const c = byId.get(id); return !!c && c.column === "done"; };
  const groups = [];
  for (const s of plan.steps||[]){
    const key = String(s.round ?? "") + "|" + s.setup;
    if (!groups.length || groups[groups.length-1].key !== key){
      const su = (plan.setups||{})[s.setup] || {title:s.setup, prepare:""};
      groups.push({key, setup:s.setup, title:su.title, prepare:su.prepare, fresh:s.round===1, steps:[]});
    }
    groups[groups.length-1].steps.push(Object.assign({}, s, {done: (s.cards||[]).length>0 && s.cards.every(cardDone)}));
  }
  const cards = Object.keys(plan.cards||{});
  return {groups, cards: cards.length, cardsDone: cards.filter(cardDone).length, steps:(plan.steps||[]).length,
          minutes: plan.minutes||0, robot: plan.robot_minutes||0, made: plan.made||""};
}
function checkMerge(ours, merged){ // same guard as check_merge() in board.py: never save a board that lost most of our cards
  const mine = new Set((ours.cards||[]).map(c=>c.id)), kept = new Set((merged.cards||[]).map(c=>c.id));
  let dropped = 0; for (const id of mine) if (!kept.has(id)) dropped++;
  if (mine.size >= 20 && dropped*10 >= mine.size*9)
    throw new Error(`Stopped: saving would remove ${dropped} of your ${mine.size} cards, which looks like a board that could not be read, not real deletions. Nothing was saved. Try ⟳ again.`);
  return merged;
}
/* The robot from the phone (2026-10-29, tools/release_test/robot_listener.py): what to show for the robot branch's
   status.json and request.json. status = null when the branch has no status (the PC has never listened). nowMs = Date.now(). */
const ROBOT_BRANCH = "robot";

      const set = (k,v) => { if (v===""||v==null||(Array.isArray(v)&&!v.length && !(k in live))) delete next[k]; else next[k]=v; };
      const text = (k, el, v) => { if (el.value !== (d[k]||"")) set(k, v); };
      text("title", title, title.value.trim() || d.title); text("why", why, why.value.trim());
      text("notes", notes, notes.value.replace(/\s+$/,"")); text("branch", branch, branch.value.trim());
      if (areaSel.value !== (d.area||"")) set("area", areaSel.value);
      if (sizeSel.value !== (d.size||"")) set("size", sizeSel.value);
      if (kindSel.value !== (d.kind||"idea")) next.kind = kindSel.value;   // Done without changes must not bump "updated"
      if (checks.value !== (d.checks||[]).join("\n")) set("checks", checks.value.split("\n").map(s=>s.trim()).filter(Boolean));
      if (waiting.checked !== !!d.waiting){ if (waiting.checked) next.waiting = true; else if ("waiting" in live) next.waiting = false; }
      const moved = column !== d.column;
      if (eq(next, live) && !moved) return false;
      Object.keys(live).forEach(k=>delete live[k]); Object.assign(live, next);
      if (moved) move(mem.ours, id, column, 0); else live.updated = now();
      return true;
    }
    return [
      h("h2",{}, "Edit card"),
      h("div",{class:"sub"}, [card.id, card.source && "from " + card.source, card.updated && "changed " + card.updated.replace("T"," ")].filter(Boolean).join(" · ")),
      field("Title", title),
      field("Why (the doubt it removes, or the fun it adds)", why),
      h("div",{class:"f"}, h("span",{},"Column"), seg(COLUMNS, column, v=>column=v)),
      h("div",{class:"row"}, field("Part", areaSel), field("Size", sizeSel), field("Kind", kindSel)),
      h("label",{class:"check"}, waiting, h("span",{}, "Waiting for me (a decision, a listen or a test run)")),
      field("Notes", notes),
      h("div",{class:"row"}, field("Branch", branch)),
      field("Release checks", checks),
      h("div",{class:"f"}, h("span",{}, `Place in ${COLUMNS.find(x=>x[0]===card.column)[1]} (now #${pos+1})`),
        h("div",{class:"seg"},
          posBtn("⤒ Top", ()=>{ move(mem.ours,id,card.column,0); changed(); }),
          posBtn("↑ Up", ()=>{ move(mem.ours,id,card.column,Math.max(0,pos-1)); changed(); }),
          posBtn("↓ Down", ()=>{ move(mem.ours,id,card.column,pos+1); changed(); }),
          posBtn("⤓ Bottom", ()=>{ move(mem.ours,id,card.column); changed(); }))),
      h("div",{class:"actions"},
        h("button",{type:"button",class:"btn primary",onclick:()=>{ const ch = apply(); close(); if (ch) changed(); }}, "Done"),
        h("button",{type:"button",class:"btn",onclick:close}, "Cancel"),
        h("div",{class:"spacer",style:"flex:1"}), del)
    ];
  });
}

function openAdd(){
  sheet(close => {
    const title = h("input",{type:"text",placeholder:"The idea in a few words",autofocus:true});
    const why = h("textarea",{rows:"3",placeholder:"Optional: why, or anything you want to remember"});
    let area = ui.area!=="all" ? ui.area : "";
    let kind = "idea";
    const go = () => {
      const t = title.value.trim(); if (!t){ title.focus(); return; }
      const d = new Date();
      add(mem.ours, t, "idea", {why: why.value.trim(), area: area || undefined, kind, waiting: false,
        source: `inbox (Watchtower Web ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())})`});
      ui.tab = "idea"; LS.set("tab","idea");
      close(); changed(); toast("Added to Ideas. Claude can turn it into a full card next session.");

      h("div",{class:"sub"}, "Lands at the top of Ideas, tagged inbox."),
      field("Idea", title),
      field("Why / details", why),
      h("div",{class:"f"}, h("span",{},"Kind"), seg([["idea","Idea"],["bug","Bug"]], kind, v=>kind=v)),
      h("div",{class:"f"}, h("span",{},"Part (optional)"), seg([["","Not sure"], ...areas().map(a=>[a,a])], area, v=>area=v)),
      h("div",{class:"actions"}, h("button",{type:"button",class:"btn primary",onclick:go}, "Add idea"), h("button",{type:"button",class:"btn",onclick:close}, "Cancel"))

}

async function openTour(){
  let plan;
  try { plan = JSON.parse(await gh("GET", null, true, "plan/test-tour.json")); }
  catch(e){ toast(e.status===404 ? "No test tour on GitHub yet." : e.message); return; }
  const r = tourRows(plan, mem.ours || {cards:[]});
  const mins = n => n < 90 ? `about ${n} min` : `about ${Math.floor(n/60)} h ${pad(n%60)} min`;
  let k = 0;
  sheet(close => [
    h("h2",{}, "Morning test tour"),
    h("div",{class:"sub"}, `${r.steps} checks · ${mins(r.minutes)} + ${mins(r.robot)} robot · ${r.cardsDone} of ${r.cards} cards done · plan of ${r.made}`),
    h("div",{class:"note"}, "Do the tour in Kolvind Watchtower on the PC (press Morning test tour): it records Pass / Fail and moves the cards. This list is read-only; ✓ = its card is in Done."),
    ...r.groups.map(g => h("div",{},
      h("div",{class:"tg"}, g.title, g.fresh ? " · NEW" : "", h("small",{}, `  ${g.steps.length} · ${mins(g.steps.reduce((a,s)=>a+s.minutes,0))}`)),
      h("div",{class:"tprep"}, g.prepare),
      ...g.steps.map(s => h("div",{class:"tstep"+(s.done?" done":"")},
        h("div",{class:"t"}, `${++k}. ${s.title}`, h("span",{class:"note"}, ` ${s.minutes} min`)),
        h("div",{class:"d"}, "Do: " + s.short_do), h("div",{class:"d"}, "Expect: " + s.short_expect))))),
    h("div",{class:"actions"}, h("button",{type:"button",class:"btn primary",onclick:close}, "Close"))
  ]);
}
/* ================================================================ the robot from the phone */
async function robotRead(name){
  try { return await gh("GET", null, true, name, ROBOT_BRANCH); }
  catch(e){ if (e.status === 404) return null; throw e; }
}
async function robotFetch(){
  const [st, rq, br] = await Promise.all([robotRead("status.json"), robotRead("request.json"), robotRead("branches.json")]);
  const parse = t => { try { const d = JSON.parse(t); return d && typeof d === "object" ? d : null; } catch { return null; } };
  return {status: st == null ? null : (parse(st) || {}), request: rq == null ? null : parse(rq), branches: br == null ? [] : (parse(br) || [])};
}
/* Every press is signed with the pairing code from Mobilroboten.bat (stored only in this browser): only this phone can
   start anything on the PC, not everyone else with access to the repo. Same text as signed_text() in robot_listener.py. */
function robotCodeNorm(c){ c = String(c||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase(); return c.length === 16 ? c : ""; }
async function robotSign(code, req){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(robotCodeNorm(code)), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(`${req.id}|${req.asked}|${req.action}|${req.branch||""}`));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2,"0")).join("");
}
/* What a press writes: ALWAYS request.json on the robot branch (2026-10-31: the PUT left out the path, so gh() used its
   default, plan/board.json - the PC never saw a press, and every later press was refused by GitHub). Tested with node. */
const ROBOT_REQUEST = "request.json";
async function robotRequest(action, branch, code, date){
  const req = Object.assign({id: "r-" + date.getTime().toString(36), asked: date.toISOString().slice(0,19) + "Z", action},
                            action === "install" ? {branch} : {});
  req.sig = await robotSign(code, req);
  const what = action === "install" ? `Uppdatera och installera ${branch}` : "Kör roboten";
  return {path: ROBOT_REQUEST, ref: ROBOT_BRANCH, message: `Robot: Tobias pressed ${what} (Watchtower Web)`, text: JSON.stringify(req) + "\n"};
}
async function robotPress(action, branch){
  const r = await robotRequest(action, branch, LS.get("robotCode",""), new Date());
  let sha;
  try { sha = (await gh("GET", null, false, r.path, r.ref)).sha; }
  catch(e){ if (e.status !== 404) throw e; }
  await gh("PUT", Object.assign({message: r.message, content: textToB64(r.text), branch: r.ref}, sha ? {sha} : {}), false, r.path);
}
function robotCopy(text){
  const done = () => toast("Testloggen är kopierad. Klistra in den till Claude.");
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(text).then(done, () => robotCopyByHand(text));
  robotCopyByHand(text);
}
function robotCopyByHand(text){ // the phone said no to the clipboard: show the log selected, copy from the menu
  sheet(close => {
    const ta = h("textarea",{class:"rb-copy",readonly:true}, text);
    setTimeout(()=>{ ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); }, 50);
    return [h("h2",{}, "Kopiera testloggen"), h("div",{class:"note"}, "Telefonen lät inte sidan kopiera. Håll fingret på texten, välj Markera alla och sedan Kopiera."),
      ta, h("div",{class:"actions"}, h("button",{type:"button",class:"btn primary",onclick:close}, "Klar"))];
  });
}
function openRobot(){
  let data = null, log = null, err = "", busy = false, timer = null, draw = () => {}, picked = LS.get("robotBranch", ""), pairing = false;
  const box = h("div",{});
  const load = async () => {
    if (timer && !box.isConnected){ clearInterval(timer); return; }   // closed, or another sheet took its place
    try {
      data = await robotFetch(); err = "";
      const v = robotView(data.status, data.request, Date.now());
      if (v.canCopy && log === null) log = await robotRead("log.txt");
      if (!v.canCopy) log = null;
    } catch(e){ err = e.message; }
    if (!askingCode()) draw();                       // never wipe a code being typed
  };
  const askingCode = () => pairing || !robotCodeNorm(LS.get("robotCode",""));
  sheet(close => {
    const run = async (action, branch) => {
      if (busy) return; busy = true; draw();
      try { await robotPress(action, branch); log = null; toast("Skickat till datorn."); await load(); }
      catch(e){ toast(e.status===404 ? "Mobilroboten är inte igång på datorn än." : e.message==="conflict" ? "Datorn hann ändra något samtidigt. Tryck igen." : e.message); }
      busy = false; draw();
    };
    draw = () => {
      if (askingCode()){
        const inp = h("input",{type:"text",placeholder:"XXXX-XXXX-XXXX-XXXX",autocomplete:"off",autocapitalize:"characters",spellcheck:"false"});
        const save = () => { if (!robotCodeNorm(inp.value)){ toast("Koden har 16 tecken, t.ex. K7QF-2MXP-9ZTR-4HDA."); return; }
          LS.set("robotCode", robotCodeNorm(inp.value)); pairing = false; toast("Parkoden är sparad i den här mobilen."); draw(); };
        box.replaceChildren(
          h("div",{class:"rb-state"}, h("div",{class:"big"}, "Skriv in parkoden"),
            h("div",{class:"d"}, "Dubbelklicka Mobilroboten.bat på datorn (GitHub Desktop → Repository → Show in Explorer → tools → release_test). Den visar en kod med 16 tecken. Skriv in den här en gång – då kan bara din mobil starta något på datorn.")),
          field("Parkod", inp),
          h("div",{class:"actions"}, h("button",{type:"button",class:"btn primary wide",onclick:save}, "Spara parkod"),
            robotCodeNorm(LS.get("robotCode","")) && h("button",{type:"button",class:"btn wide",onclick:()=>{ pairing = false; draw(); }}, "Avbryt")));
        return;
      }
      if (!data){ box.replaceChildren(h("div",{class:"note"}, err || "Hämtar…")); return; }
      const v = robotView(data.status, data.request, Date.now());
      const pk = robotPick(data.branches, picked);
      const sel = pk.list.length ? h("select",{class:"sel",style:"max-width:none;width:100%",onchange:e=>{ picked = e.target.value; LS.set("robotBranch", picked); draw(); }},
        ...pk.list.map(b => h("option",{value:b.name, selected: pk.sel && b.name === pk.sel.name}, b.name + (b.current ? " (installerad)" : "") + (b.date ? "  · " + b.date : "")))) : null;
      box.replaceChildren(...[
        h("div",{class:"rb-state " + v.kind},
          h("div",{class:"big"}, v.title),
          v.text && h("div",{class:"d"}, v.text),
          v.steps.length ? h("ol",{class:"rb-steps"}, ...v.steps.map(x => h("li",{class:x.state},
            h("span",{class:"dot"}, x.state === "done" ? "✓" : x.state === "now" ? "●" : "○"), x.label))) : null,
          v.elapsed && h("div",{class:"d"}, v.elapsed),
          v.now && !v.steps.length && h("div",{class:"d note"}, "Just nu: " + v.now),   // the steps say it in Swedish
          v.total && h("div",{class:"rb-tot"}, h("span",{class:"p"}, `✓ ${v.total.pass} godkända`), h("span",{class:"f"}, `✗ ${v.total.fail} fel`), h("span",{class:"s"}, `${v.total.skip} hoppades över`))),
        v.fails.length ? h("div",{class:"tg"}, "Det här gick fel") : null,
        ...v.fails.map(f => h("div",{class:"rb-fail"}, h("div",{class:"t"}, f.title || f.id), f.note && h("div",{class:"n"}, f.note))),
        err && h("div",{class:"note"}, err),
        sel && h("label",{class:"f"}, h("span",{}, "Branch"), sel),
        pk.sel && pk.sel.note && h("div",{class:"note"}, pk.sel.note),
        pk.hint && h("div",{class:"note"}, pk.hint),
        v.pc && h("div",{class:"rb-pc"}, v.pc),
        h("div",{class:"actions"},
          sel && h("button",{type:"button",class:"btn wide" + (pk.canRunHere ? "" : " primary"),disabled: !v.canRun || !pk.canInstall || busy,
            onclick:()=>run("install", pk.sel.name)}, busy ? "Skickar…" : "⬇️ Uppdatera och installera"),
          h("button",{type:"button",class:"btn wide" + (pk.canRunHere || !sel ? " primary" : ""),disabled: !v.canRun || busy || (sel && !pk.canRunHere),
            onclick:()=>run("run")}, busy ? "Skickar…" : "🤖 Kör roboten"),
          v.canCopy && h("button",{type:"button",class:"btn wide",disabled: log == null,onclick:()=>robotCopy(log)}, log == null ? "Hämtar testloggen…" : "📋 Kopiera testloggen"),
          h("button",{type:"button",class:"btn wide",onclick:close}, "Stäng")),
        h("div",{class:"note",style:"text-align:center;margin-top:6px"}, h("a",{href:"#",onclick:e=>{ e.preventDefault(); pairing = true; draw(); }}, "Byt parkod"),
          " · sidan uppdaterad " + PAGE_VERSION)].filter(Boolean));
    };
    draw();
    return [h("h2",{}, "Roboten"), h("div",{class:"sub"}, "Välj branch, installera den på datorn och låt roboten testa Kolvind (pluginval, REAPER-roboten och ljudkollarna)."), box];
  }, () => clearInterval(timer));
  load(); timer = setInterval(load, 15000);
}
function applyTheme(){ const t = LS.get("theme","auto"); if (t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

/* ================================================================ start */
function start(){
  if (!cfg.token){ status("", "Not connected"); openSetup(true); return; }
  const draft = LS.get("draft", null);
  if (draft && draft.repo===cfg.repo && draft.ours && !mem.ours){ mem.base=draft.base; mem.ours=draft.ours; mem.sha=draft.sha; dirty=draft.dirty||0; }
  $("#app").classList.remove("hidden"); $("#fab").classList.remove("hidden");
  render(); pull();
}
applyTheme();
$("#q").addEventListener("input", e=>{ ui.q=e.target.value; render(); });
$("#area").addEventListener("change", e=>{ ui.area=e.target.value; LS.set("area",ui.area); render(); });
$("#waitOnly").addEventListener("click", ()=>{ ui.waitOnly=!ui.waitOnly; LS.set("waitOnly",ui.waitOnly); render(); });
$("#addBtn").addEventListener("click", openAdd);
$("#fab").addEventListener("click", openAdd);
$("#tourBtn").addEventListener("click", ()=>{ if (cfg.token) openTour(); else openSetup(true); });
$("#robotBtn").addEventListener("click", ()=>{ if (cfg.token) openRobot(); else openSetup(true); });
$("#syncBtn").addEventListener("click", ()=>{ if (dirty) save(); else pull(); });
$("#setupBtn").addEventListener("click", ()=>openSetup(false));
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && cfg.token && mem.ours && !drag) { dirty ? save() : pull(true); } });
addEventListener("online", ()=>{ if (dirty) save(); });
addEventListener("keydown", e=>{ if (e.key==="Escape") { const s=$(".scrim"); if (s) s.click(); } });
start();
})();
